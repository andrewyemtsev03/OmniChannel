# Render Blueprint: one web service (API + React app + doctor viewer) and one PostgreSQL database.
# For demos with fictional data only. Render has no Kazakhstan region, so real doctors' data must not go here.
services:
  - type: web
    name: stada-omnichannel
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stada-omnichannel-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: stada-omnichannel-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []   # no access from outside Render; the web service connects internally
